name: Build packages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos_repo: theos/theos
          - scheme: roothide
            theos_repo: roothide/theos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos and patched SDKs
        env:
          THEOS_REPO: ${{ matrix.theos_repo }}
        run: |
          set -euo pipefail
          theos_dir="$RUNNER_TEMP/theos"
          sdks_dir="$RUNNER_TEMP/patched-sdks"
          git clone --depth 1 "https://github.com/${THEOS_REPO}.git" "$theos_dir"
          git clone --depth 1 "https://github.com/theos/sdks.git" "$sdks_dir"
          mkdir -p "$theos_dir/sdks"
          cp -R "$sdks_dir/iPhoneOS16.5.sdk" "$theos_dir/sdks/"
          echo "THEOS=$theos_dir" >> "$GITHUB_ENV"
          test -d "$theos_dir/sdks/iPhoneOS16.5.sdk"

      - name: Build package
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          mkdir -p artifacts
          find packages -type f -name '*.deb' -exec cp {} "artifacts/DataLogoSwitcher-${{ matrix.scheme }}.deb" \;
          test -s "artifacts/DataLogoSwitcher-${{ matrix.scheme }}.deb"

      - name: Upload ${{ matrix.scheme }} package
        uses: actions/upload-artifact@v4
        with:
          name: DataLogoSwitcher-${{ matrix.scheme }}
          path: artifacts/DataLogoSwitcher-${{ matrix.scheme }}.deb
          if-no-files-found: error
