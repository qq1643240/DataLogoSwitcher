name: Build packages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            theos_repo: theos/theos
          - scheme: roothide
            theos_repo: roothide/theos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare Theos directory
        run: mkdir -p "$GITHUB_WORKSPACE/theos"

      - name: Install Theos and patched SDKs
        uses: waruhachi/theos-action@main
        with:
          theos-src: ${{ matrix.theos_repo }}
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master

      - name: Build package
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          mkdir -p artifacts
          find packages -type f -name '*.deb' -exec cp {} "artifacts/DataLogoSwitcher-${{ matrix.scheme }}.deb" \;
          test -s "artifacts/DataLogoSwitcher-${{ matrix.scheme }}.deb"

      - name: Upload ${{ matrix.scheme }} package
        uses: actions/upload-artifact@v4
        with:
          name: DataLogoSwitcher-${{ matrix.scheme }}
          path: artifacts/DataLogoSwitcher-${{ matrix.scheme }}.deb
          if-no-files-found: error
